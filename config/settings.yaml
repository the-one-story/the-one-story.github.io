# One Story - pipeline settings.
# Everything here is a tunable input. The scoring weights especially are meant
# to be experimented with - see README "How the scoring works".

# --- Time window ---
timezone: Australia/Sydney   # window + display timezone (IANA name)
window_hours: 24             # rolling lookback ending at run time
update_hour_local: 5         # the daily run hour in `timezone` above - render shows
                             # the next one. The job targets 05:00 Sydney all year
                             # (daily.yml runs two UTC crons, 18:00 + 19:00, and a
                             # gate job drops whichever isn't 05:00 local today), so
                             # this is season-independent - no DST upkeep needed.
# Daily lock: once a day's winner is chosen it stays that story for the rest of
# the (local) day, refreshing only its coverage counts - "one story a day".
daily_lock: true

# --- Fetch ---
snippet_cap_words: 25        # COPYRIGHT guard: hard cap on feed description words
fetch_timeout_secs: 15       # per-feed network timeout; a dead feed never kills the run

# --- Cluster ---
# TF-IDF + cosine similarity over title + snippet, then group.
# cluster_method:
#   agglomerative        - average-linkage; only merges groups whose AVERAGE
#                          similarity is high, so a broad article can't chain
#                          two unrelated stories together (the default).
#   connected_components - single-linkage union-find (prone to chaining; kept
#                          as a swappable fallback).
cluster_method: agglomerative
cluster_distance_threshold: 0.92   # agglomerative: merge while cosine-distance < this
similarity_threshold: 0.18         # connected_components: join if cosine >= this
min_df: 1                          # TF-IDF: ignore terms in fewer than this many docs

# --- Score ---
# score = coverage^w_coverage * diversity^w_diversity
#         * recency^w_recency * novelty^w_novelty
# Weights are exponents (relative emphasis). Diversity is deliberately the
# heaviest by default - it is how we fight raw-volume bias.
weights:
  coverage: 1.0
  diversity: 1.6    # THE key term - spread across countries AND leans
  recency: 0.8
  novelty: 1.0

scoring:
  # diversity = (countries_norm ** country_share) * (leans_norm ** lean_share)
  # country_share + lean_share should sum to 1.0; tilt toward whichever axis
  # matters more to you.
  country_share: 0.5
  lean_share: 0.5
  # recency half-life (hours): a cluster whose centroid publish time is this
  # many hours old scores 0.5 on the recency term. Shorter = favours breaking.
  recency_half_life_hours: 10
  # novelty: multiplier applied when today's winner-candidate matches a story
  # that led on a recent prior day. 1.0 = no penalty, 0.0 = fully suppressed.
  # penalty_floor anchors the decay line as age -> 0; because only PRIOR days
  # (age_days >= 1) penalise, the strongest penalty actually realised is
  # floor + (1-floor)*(1/decay_days) - e.g. ~0.51 for a story that led yesterday.
  # The penalty then decays linearly back toward 1.0 over novelty_decay_days.
  novelty_penalty_floor: 0.35
  novelty_decay_days: 4
  # a candidate must match a prior lead at cosine >= this to be penalised.
  novelty_match_threshold: 0.30

# --- Decay ledger ---
ledger_days: 7               # how many days of prior winners to remember
ledger_path: data/recent_leads.json

# --- Output ---
ranked_json_path: data/ranked.json
output_html: index.html

# --- Newsletter (Brevo) ---
# Single opt-in signup form on the site + a daily campaign of the winner, sent
# via Brevo's API from the daily job. Brevo (unlike Buttondown) allows single
# opt-in, so a signup is instant - no confirmation email. To (re)configure:
#   1. Brevo account -> verify a sender address -> create a contact list.
#   2. Fill sender_email + list_id below.
#   3. Create a Brevo subscription form; paste its action URL into
#      signup_form_url (that renders the signup form on the site, posting
#      straight to Brevo - no backend, no key on the page).
#   4. Add BREVO_API_KEY as a GitHub Actions secret (the daily job needs it to
#      send). Without a verified sender_email + list_id + key it stays dry-run.
newsletter:
  enabled: true
  # Moved off Brevo 13/08/2026 after it suspended the account (Terms of Use) and
  # killed the newsletter for days. Resend is a developer-first sender: one call
  # (POST /broadcasts with send:true) does what Brevo needed two for, and it does
  # not run marketing-compliance content classification. Set provider back to
  # `brevo` and the old path still works - it is retired, not removed.
  provider: resend
  api_base: https://api.resend.com
  # Resend addresses a SEGMENT (uuid), where Brevo addressed a numeric list id.
  # Fill this in from the Resend dashboard once the audience exists.
  segment_id: ""
  sender_name: "One Story"
  # Sends from our OWN Brevo-authenticated domain (mail.charlietrenorden.com,
  # authenticated 04/08/2026: brevo-code TXT + 2 DKIM CNAMEs + DMARC, all live in
  # Cloudflare as DNS-only). Previously a gmail address, which Brevo had to rewrite
  # to its SHARED <id>.brevosend.com domain - auth passed but the shared domain's
  # cold reputation sent first emails to spam. Now the reputation is ours alone.
  sender_email: "onestory@mail.charlietrenorden.com"
  list_id: 2                                        # Brevo list "Your first list"
  signup_form_url: "https://6de84235.sibforms.com/serve/MUIFABJRu0JpFgRzIpeyQY1ujh6jE5WFKXT6i7aP9c-LRXqSFOZe6uCPyqdakcYQP7sTRrnFbX_3db_R19NlljLVQcyVPRR5LeE6jDM9CNJlbmqezDRcfVbOpQHuBWjqLI03bjhDpKrF3j7ImuauWsVQzd_-nz-HXglI4VIWUd4XtyW7fgbJxXopNu4v5fc_Sq5Twj6a4hWllqJ2vA=="
