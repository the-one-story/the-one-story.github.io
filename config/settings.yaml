# One Story - pipeline settings.
# Everything here is a tunable input. The scoring weights especially are meant
# to be experimented with - see README "How the scoring works".

# --- Time window ---
timezone: Australia/Sydney   # window + display timezone (IANA name)
window_hours: 24             # rolling lookback ending at run time
update_hour_utc: 20          # the daily cron hour (UTC) - render shows the next one
                             # 20:00 UTC == 06:00 AEST / 07:00 AEDT
# Daily lock: once a day's winner is chosen it stays that story for the rest of
# the (local) day, refreshing only its coverage counts - "one story a day".
daily_lock: true

# --- Fetch ---
snippet_cap_words: 25        # COPYRIGHT guard: hard cap on feed description words
fetch_timeout_secs: 15       # per-feed network timeout; a dead feed never kills the run

# --- Cluster ---
# TF-IDF + cosine similarity over title + snippet, then group.
# cluster_method:
#   agglomerative        - average-linkage; only merges groups whose AVERAGE
#                          similarity is high, so a broad article can't chain
#                          two unrelated stories together (the default).
#   connected_components - single-linkage union-find (prone to chaining; kept
#                          as a swappable fallback).
cluster_method: agglomerative
cluster_distance_threshold: 0.92   # agglomerative: merge while cosine-distance < this
similarity_threshold: 0.18         # connected_components: join if cosine >= this
min_df: 1                          # TF-IDF: ignore terms in fewer than this many docs

# --- Score ---
# score = coverage^w_coverage * diversity^w_diversity
#         * recency^w_recency * novelty^w_novelty
# Weights are exponents (relative emphasis). Diversity is deliberately the
# heaviest by default - it is how we fight raw-volume bias.
weights:
  coverage: 1.0
  diversity: 1.6    # THE key term - spread across countries AND leans
  recency: 0.8
  novelty: 1.0

scoring:
  # diversity = (countries_norm ** country_share) * (leans_norm ** lean_share)
  # country_share + lean_share should sum to 1.0; tilt toward whichever axis
  # matters more to you.
  country_share: 0.5
  lean_share: 0.5
  # recency half-life (hours): a cluster whose centroid publish time is this
  # many hours old scores 0.5 on the recency term. Shorter = favours breaking.
  recency_half_life_hours: 10
  # novelty: multiplier applied when today's winner-candidate matches a story
  # that led on a recent prior day. 1.0 = no penalty, 0.0 = fully suppressed.
  # penalty_floor is the strongest penalty (most-recent prior lead); it decays
  # back toward 1.0 over novelty_decay_days.
  novelty_penalty_floor: 0.35
  novelty_decay_days: 4
  # a candidate must match a prior lead at cosine >= this to be penalised.
  novelty_match_threshold: 0.30

# --- Decay ledger ---
ledger_days: 7               # how many days of prior winners to remember
ledger_path: data/recent_leads.json

# --- Output ---
ranked_json_path: data/ranked.json
output_html: index.html

# --- Newsletter (optional; off until configured) ---
# Signup form + a daily email of the winner via Buttondown.
# To turn it on:
#   1. Create a free Buttondown account; note your username.
#   2. Put the username below (that renders the signup form on the site).
#   3. Set enabled: true and add BUTTONDOWN_API_KEY as a GitHub Actions secret
#      (that lets the daily job actually send). Without the key it stays dry-run.
newsletter:
  enabled: true
  buttondown_username: "onestory"        # e.g. "onestory" - renders the signup form when set
  api_base: https://api.buttondown.email/v1
  send_status: about_to_send     # Buttondown: sends immediately (vs "draft")
