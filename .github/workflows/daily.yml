name: Daily One Story

# Target: 05:00 Sydney EVERY day of the year. GitHub Actions cron is fixed UTC and
# ignores daylight saving, so one cron line would drift an hour twice a year. Two
# lines cover both regimes and the `gate` job below drops the wrong one:
#   18:00 UTC == 05:00 AEDT (summer, UTC+11)
#   19:00 UTC == 05:00 AEST (winter, UTC+10)
# The gate asks "is it >= 05:00 local AND has today's edition not been emailed
# yet?" rather than "is the clock exactly 05:00?" - Actions cron is routinely
# delayed by hours, and an exact-hour test silently turns a late run into a missed
# day (it did, 06/08/2026). The page's "next update" line is rendered from
# config/settings.yaml `update_hour_local` (5), season-independent, no upkeep here.
on:
  schedule:
    - cron: "0 18 * * *"   # 05:00 AEDT
    - cron: "0 19 * * *"   # 05:00 AEST
  workflow_dispatch:
    inputs:
      test_send:
        description: "Send a one-off [Preview] test email now (doesn't affect the daily send)"
        type: boolean
        default: false
      test_email:
        description: "Override recipient for the test send (defaults to the BREVO_TEST_EMAIL secret). Not a secret - just an address."
        type: string
        default: ""

# Let the job commit the regenerated page + the decay ledger back to the repo.
permissions:
  contents: write

# Never let two daily runs race on the commit.
concurrency:
  group: one-story-daily
  cancel-in-progress: false

jobs:
  # Which of the two cron lines is the real 05:00 Sydney one TODAY? Ask the tz
  # database rather than hardcoding DST dates, so it stays correct if the rules
  # ever change. A manual dispatch always proceeds.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: check
        env:
          EVENT: ${{ github.event_name }}
          WANT_LOCAL_HOUR: "5"
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          want = int(os.environ["WANT_LOCAL_HOUR"])
          now = datetime.now(ZoneInfo("Australia/Sydney"))
          today = now.date().isoformat()

          # Which local date did we last actually EMAIL an edition for? Written by
          # send_email.py on a real send (a --test send deliberately does not touch
          # it), and committed, so it is the honest "today is already done" flag.
          try:
              with open("data/last_email.json", encoding="utf-8") as fh:
                  last = (json.load(fh) or {}).get("date")
          except (OSError, ValueError):
              last = None

          # Run when it is late enough AND today has not gone out yet - NOT when the
          # clock reads exactly 05:00. Actions cron is regularly delayed by hours
          # (06/08/2026: the 19:00 UTC run started 22:41 UTC = 08:41 Sydney), and an
          # exact-hour test turns a late run into a skipped day. This form still
          # drops the wrong cron of the two - in AEST 18:00 UTC is 04:00 local, too
          # early; in AEDT 18:00 UTC is 05:00 and runs, then 19:00 UTC is 06:00 and
          # is stopped by the already-sent check - while letting a delayed run
          # through so the edition is merely late instead of missing.
          if os.environ["EVENT"] != "schedule":
              ok, why = True, "manual dispatch"
          elif now.hour < want:
              ok, why = False, f"too early (before {want:02d}:00 local)"
          elif last == today:
              ok, why = False, f"already emailed for {today}"
          else:
              ok, why = True, f"due (last emailed: {last})"

          print(f"Sydney now {now:%Y-%m-%d %H:%M %Z} (UTC{now:%z}); "
                f"want >={want:02d}:00 local -> run={ok} ({why})")
          # Only key=value belongs in GITHUB_OUTPUT; the log line above goes to stdout.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"run={'true' if ok else 'false'}\n")
          PY

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python run.py

      # Sends the daily email if the newsletter is enabled AND the secret is
      # set; otherwise the script dry-runs. The per-day guard prevents a
      # double-send on re-runs.
      # continue-on-error keeps a bad send from blocking the PUBLISH below - but
      # it also swallows the exit code, and `gh run list` then shows a green run.
      # That hid a dead newsletter for three days (10-12/08/2026, Brevo 402
      # account_under_validation). The outcome is re-raised after the commit step
      # so publishing still happens AND a failed send is visibly a failed run.
      - name: Send newsletter (if configured)
        id: send
        continue-on-error: true
        env:
          # send_email.py reads whichever pair matches newsletter.provider, so
          # both are passed and the unused one is simply ignored.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          # --test recipient: the test_email dispatch input overrides the secret.
          RESEND_TEST_EMAIL: ${{ github.event.inputs.test_email != '' && github.event.inputs.test_email || secrets.BREVO_TEST_EMAIL }}
          BREVO_TEST_EMAIL: ${{ github.event.inputs.test_email != '' && github.event.inputs.test_email || secrets.BREVO_TEST_EMAIL }}
        run: python send_email.py ${{ github.event.inputs.test_send == 'true' && '--test' || '' }}

      - name: Commit regenerated page + ledger
        run: |
          git config user.name  "one-story-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html email.html data/recent_leads.json data/last_email.json data/history
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily update: $(date -u +'%Y-%m-%d %H:%MZ')"
            git push
          fi

      # Runs last, so the page is already published. Fails the run when the
      # newsletter did not go out, so a dead send is loud instead of silent.
      - name: Surface a failed send
        if: steps.send.outcome == 'failure'
        run: |
          echo "::error title=Newsletter not sent::send_email.py failed - see the \
          'Send newsletter' step. The site published normally; only the email failed."
          exit 1
